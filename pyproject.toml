[project]
name = "orbitfin"
version = "0.1.0"
description = "Organizador financeiro pessoal (Streamlit + Xano), estruturado com OpenSpec"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Código em src/ (imports sem prefixo: "from core.api import ...");
# test/ no path para os auxiliares ("from helpers.fakes import ...").
pythonpath = ["src", "test"]
testpaths = ["test"]
